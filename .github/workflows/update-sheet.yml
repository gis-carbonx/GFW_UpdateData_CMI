name: GFW version diff

# Dijalankan manual dari tab Actions (tombol "Run workflow").
# Terpisah dari workflow "Update Google Sheet GFW Alerts" dan tidak menyentuh spreadsheet.
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset GFW yang dibandingkan"
        type: choice
        default: gfw_integrated_alerts
        options:
          - gfw_integrated_alerts
          - gfw_integrated_dist_alerts

permissions:
  contents: read

jobs:
  version-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Bandingkan versi dataset
        env:
          GFW_API_KEY: ${{ secrets.GFW_API_KEY }}
          GFW_DATASET: ${{ inputs.dataset }}
        run: python gfw_version_diff.py

      - name: Simpan hasil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-diff-${{ inputs.dataset }}
          path: version_diff/
          retention-days: 30
